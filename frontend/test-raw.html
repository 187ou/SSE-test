<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SSE 原始测试</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        #output { margin-top: 20px; padding: 10px; background: #f5f5f5; white-space: pre-wrap; font-size: 12px; }
        button { padding: 10px 20px; font-size: 16px; }
        .hex { color: #666; font-size: 10px; }
    </style>
</head>
<body>
    <h1>SSE 原始数据测试</h1>
    <button onclick="test()">发送消息</button>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');

        function log(msg) {
            const div = document.createElement('div');
            div.textContent = msg;
            output.appendChild(div);
            console.log(msg);
        }

        async function test() {
            output.innerHTML = '';
            log('开始发送...');

            try {
                const response = await fetch('http://localhost:8080/api/chat/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'hi' })
                });

                log('Status: ' + response.status);
                log('Headers:');
                response.headers.forEach((value, key) => {
                    log('  ' + key + ': ' + value);
                });

                if (!response.body) {
                    log('Error: No body');
                    return;
                }

                log('\n开始读取流...\n');

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();

                    if (done) {
                        log('\n流结束');
                        break;
                    }

                    // 显示原始字节
                    const hex = Array.from(value).map(b => b.toString(16).padStart(2, '0')).join(' ');
                    log('收到 ' + value.length + ' 字节: ' + hex.substring(0, 100));

                    // 解码
                    const chunk = decoder.decode(value, { stream: true });
                    log('解码: ' + JSON.stringify(chunk));

                    buffer += chunk;

                    // 按行分割
                    const lines = buffer.split(/\r?\n/);
                    buffer = lines.pop() || '';

                    log('处理 ' + lines.length + ' 行:');

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed) {
                            log('  [空行]');
                            continue;
                        }

                        if (trimmed.startsWith('data:')) {
                            const data = trimmed.substring(5).trim();
                            log('  [data] ' + JSON.stringify(data));
                        } else if (trimmed.startsWith(':')) {
                            log('  [注释] ' + JSON.stringify(trimmed));
                        } else {
                            log('  [其他] ' + JSON.stringify(trimmed));
                        }
                    }

                    log('');
                }

                if (buffer) {
                    log('剩余buffer: ' + JSON.stringify(buffer));
                }

            } catch (error) {
                log('Error: ' + error.message);
                console.error(error);
            }
        }
    </script>
</body>
</html>
