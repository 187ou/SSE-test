<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>SSE Test</title>
</head>
<body>
    <h1>SSE 流式输出测试</h1>
    <div id="output" style="padding: 20px; font-size: 18px; line-height: 1.6;"></div>
    <div id="raw" style="padding: 20px; background: #f5f5f5; margin-top: 20px; font-family: monospace; white-space: pre-wrap;"></div>

    <script>
        const output = document.getElementById('output');
        const raw = document.getElementById('raw');
        
        async function testSSE() {
            try {
                const response = await fetch('http://localhost:8080/api/chat/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: '你好' })
                });
                
                raw.textContent = 'Response Type: ' + response.headers.get('Content-Type') + '\n\n';
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    raw.textContent += '--- Chunk ---\n' + chunk + '\n';
                    buffer += chunk;
                    
                    // 处理完整的行
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || ''; // 保留不完整的行
                    
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (trimmed.startsWith('data:')) {
                            const data = trimmed.substring(5).trim();
                            if (data && data !== '[DONE]') {
                                output.textContent += data;
                                raw.textContent += '✓ Data: ' + data + '\n';
                            }
                        }
                    }
                }
                
                raw.textContent += '\n--- Done ---';
            } catch (error) {
                output.textContent = 'Error: ' + error.message;
                raw.textContent = 'Error: ' + error.message;
            }
        }
        
        testSSE();
    </script>
</body>
</html>
