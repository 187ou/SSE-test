<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SSE 调试测试</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        #output { margin-top: 20px; padding: 10px; background: #f5f5f5; }
        .log { margin: 5px 0; padding: 5px; border-left: 3px solid #666; }
        .log.data { border-color: #4CAF50; background: #e8f5e9; }
        .log.chunk { border-color: #2196F3; background: #e3f2fd; }
        .log.error { border-color: #f44336; background: #ffebee; }
    </style>
</head>
<body>
    <h1>SSE 调试测试</h1>
    <button onclick="testSSE()">发送消息</button>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');

        function log(message, type = '') {
            const div = document.createElement('div');
            div.className = 'log ' + type;
            div.textContent = message;
            output.appendChild(div);
            console.log(message);
        }

        async function testSSE() {
            output.innerHTML = '';
            log('开始发送请求...');

            try {
                const response = await fetch('http://localhost:8080/api/chat/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: '你好' })
                });

                log('Response status: ' + response.status, 'chunk');
                log('Content-Type: ' + response.headers.get('Content-Type'), 'chunk');

                if (!response.body) {
                    log('Error: No response body', 'error');
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let fullText = '';

                log('开始读取流...', 'chunk');

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) {
                        log('流结束', 'chunk');
                        break;
                    }

                    const chunk = decoder.decode(value);
                    log('收到chunk: ' + chunk.substring(0, 100) + (chunk.length > 100 ? '...' : ''), 'chunk');

                    buffer += chunk;

                    // 处理完整的行
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed) continue;

                        if (trimmed.startsWith('data:')) {
                            const data = trimmed.substring(5).trim();
                            log('收到data: ' + data, 'data');

                            if (data === '[DONE]') {
                                log('流完成', 'data');
                                continue;
                            }

                            fullText += data;
                        } else if (trimmed.startsWith('event:')) {
                            log('收到event: ' + trimmed.substring(6).trim());
                        } else if (trimmed.startsWith(':')) {
                            // comment, skip
                        } else {
                            log('其他: ' + trimmed);
                        }
                    }
                }

                log('完整回复: ' + fullText, 'data');

            } catch (error) {
                log('Error: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
