<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>流式输出测试</title>
</head>
<body>
    <h1>流式输出测试</h1>
    <button onclick="sendMessage()">发送消息</button>
    <div id="output" style="border: 1px solid #ccc; padding: 20px; margin-top: 20px; min-height: 200px; background: #f5f5f5;"></div>
    <div id="debug" style="border: 1px solid #999; padding: 10px; margin-top: 20px; background: #fff; font-family: monospace; font-size: 12px;"></div>

    <script>
        const output = document.getElementById('output');
        const debug = document.getElementById('debug');
        let fullText = '';

        function log(msg) {
            debug.textContent += msg + '\n';
            console.log(msg);
        }

        async function sendMessage() {
            output.innerHTML = '';
            debug.innerHTML = '';
            fullText = '';
            log('开始发送...');

            try {
                const response = await fetch('http://localhost:8080/api/chat/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: '你好' })
                });

                log('Status: ' + response.status);
                log('Content-Type: ' + response.headers.get('Content-Type'));
                log('Has body: ' + !!response.body);

                if (!response.body) {
                    log('错误: 没有响应体');
                    return;
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                log('开始读取流...\n');

                while (true) {
                    const { done, value } = await reader.read();

                    if (done) {
                        log('\n流结束');
                        break;
                    }

                    const chunk = decoder.decode(value);
                    log('收到 ' + value.length + ' 字节');
                    log('Chunk: ' + JSON.stringify(chunk.substring(0, 100)));

                    buffer += chunk;

                    // 按行分割
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed) {
                            log('  [空行]');
                            continue;
                        }

                        if (trimmed.startsWith('data:')) {
                            const data = trimmed.substring(5).trim();
                            log('  [data] ' + JSON.stringify(data));

                            if (data === '[DONE]') {
                                log('  [完成]');
                                continue;
                            }

                            if (data) {
                                fullText += data;
                                output.innerHTML = fullText.replace(/\n/g, '<br>');
                            }
                        } else {
                            log('  [其他] ' + JSON.stringify(trimmed));
                        }
                    }
                }

                log('\n最终完整文本: ' + fullText);

            } catch (error) {
                log('Error: ' + error.message);
                console.error(error);
            }
        }
    </script>
</body>
</html>
